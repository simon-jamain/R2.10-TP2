<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Tests unitaires — Service 1 : Calculs Matriciels</title>
  <style>
    body { font-family: monospace; background: #ffffff; color: #000000; padding: 20px; }
    h1 { color: #000000; }
    h2 { color: #000000; margin-top: 30px; border-bottom: 1px solid #cccccc; padding-bottom: 5px; }
    button {
      background: #000000; color: #ffffff; border: none;
      padding: 10px 20px; cursor: pointer; font-size: 14px;
      margin-bottom: 20px;
    }
    button:hover { background: #333333; }
    .test { margin: 6px 0; padding: 6px 10px; font-size: 13px; border-left: 3px solid; }
    .pass { border-color: #000000; color: #000000; }
    .fail { border-color: #000000; color: #000000; font-weight: bold; }
    #summary {
      margin-top: 20px; padding: 12px 16px;
      font-size: 15px; font-weight: bold; border: 1px solid #000000;
    }
    .summary-pass { background: #ffffff; color: #000000; }
    .summary-fail { background: #ffffff; color: #000000; }
    #results { margin-top: 10px; }
  </style>
</head>
<body>

<h1>Tests unitaires — Service 1 : Calculs Matriciels</h1>
<p>URL cible : <code>http://localhost:5001</code> — Assurez-vous que le service est lancé (<code>python app.py</code>)</p>

<button onclick="lancerTousLesTests()">▶ Lancer tous les tests</button>

<div id="summary"></div>
<div id="results"></div>

<script>
const BASE_URL = "http://localhost:5001";
let passed = 0, failed = 0;

// ─── Utilitaires ────────────────────────────────────────────────

async function post(route, payload) {
  const response = await fetch(BASE_URL + route, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  const data = await response.json();
  return { status: response.status, data };
}

function deepEqual(a, b) {
  return JSON.stringify(a) === JSON.stringify(b);
}

function assertAlmostEqual(a, b, places = 4) {
  return Math.abs(a - b) < Math.pow(10, -places);
}

function afficherTest(nom, ok, detail = "") {
  const div = document.createElement("div");
  div.className = "test " + (ok ? "pass" : "fail");
  div.textContent = (ok ? "✓" : "✗") + "  " + nom + (detail ? " — " + detail : "");
  document.getElementById("results").appendChild(div);
  ok ? passed++ : failed++;
}

function afficherSection(titre) {
  const h2 = document.createElement("h2");
  h2.textContent = titre;
  document.getElementById("results").appendChild(h2);
}

// ─── Route 1 — POST /matrices/add ───────────────────────────────

async function testAddMatrices() {
  afficherSection("TestAddMatrices — POST /matrices/add");

  // test_addition_matrices_2x2_valide
  try {
    const { status, data } = await post("/matrices/add", { A: [[1,2],[3,4]], B: [[5,6],[7,8]] });
    const ok = status === 200 && data.operation === "addition" && deepEqual(data.resultat, [[6.0,8.0],[10.0,12.0]]);
    afficherTest("test_addition_matrices_2x2_valide", ok);
  } catch(e) { afficherTest("test_addition_matrices_2x2_valide", false, e.message); }

  // test_addition_matrices_3x3
  try {
    const { status, data } = await post("/matrices/add", {
      A: [[1,0,0],[0,1,0],[0,0,1]],
      B: [[1,1,1],[1,1,1],[1,1,1]]
    });
    const ok = status === 200 && deepEqual(data.resultat, [[2.0,1.0,1.0],[1.0,2.0,1.0],[1.0,1.0,2.0]]);
    afficherTest("test_addition_matrices_3x3", ok);
  } catch(e) { afficherTest("test_addition_matrices_3x3", false, e.message); }

  // test_addition_matrice_avec_zeros
  try {
    const { status, data } = await post("/matrices/add", { A: [[3,7],[2,5]], B: [[0,0],[0,0]] });
    const ok = status === 200 && deepEqual(data.resultat, [[3.0,7.0],[2.0,5.0]]);
    afficherTest("test_addition_matrice_avec_zeros", ok);
  } catch(e) { afficherTest("test_addition_matrice_avec_zeros", false, e.message); }

  // test_addition_matrices_1x1
  try {
    const { status, data } = await post("/matrices/add", { A: [[10]], B: [[-3]] });
    const ok = status === 200 && deepEqual(data.resultat, [[7.0]]);
    afficherTest("test_addition_matrices_1x1", ok);
  } catch(e) { afficherTest("test_addition_matrices_1x1", false, e.message); }

  // test_addition_matrices_valeurs_negatives
  try {
    const { status, data } = await post("/matrices/add", { A: [[-1,-2],[-3,-4]], B: [[1,2],[3,4]] });
    const ok = status === 200 && deepEqual(data.resultat, [[0.0,0.0],[0.0,0.0]]);
    afficherTest("test_addition_matrices_valeurs_negatives", ok);
  } catch(e) { afficherTest("test_addition_matrices_valeurs_negatives", false, e.message); }

  // test_addition_dimensions_incompatibles_retourne_400
  try {
    const { status, data } = await post("/matrices/add", { A: [[1,2],[3,4]], B: [[1,2,3],[4,5,6]] });
    const ok = status === 400 && "erreur" in data;
    afficherTest("test_addition_dimensions_incompatibles_retourne_400", ok);
  } catch(e) { afficherTest("test_addition_dimensions_incompatibles_retourne_400", false, e.message); }

  // test_addition_cle_manquante_retourne_400
  try {
    const { status } = await post("/matrices/add", { A: [[1,2],[3,4]] });
    afficherTest("test_addition_cle_manquante_retourne_400", status === 400);
  } catch(e) { afficherTest("test_addition_cle_manquante_retourne_400", false, e.message); }

  // test_addition_valeur_non_numerique_retourne_400
  try {
    const { status } = await post("/matrices/add", { A: [["a","b"],["c","d"]], B: [[1,2],[3,4]] });
    afficherTest("test_addition_valeur_non_numerique_retourne_400", status === 400);
  } catch(e) { afficherTest("test_addition_valeur_non_numerique_retourne_400", false, e.message); }
}

// ─── Route 2 — POST /matrices/multiply ──────────────────────────

async function testMultiplyMatrices() {
  afficherSection("TestMultiplyMatrices — POST /matrices/multiply");

  // test_multiplication_matrices_2x2
  try {
    const { status, data } = await post("/matrices/multiply", { A: [[1,2],[3,4]], B: [[5,6],[7,8]] });
    const ok = status === 200 && data.operation === "multiplication" && deepEqual(data.resultat, [[19.0,22.0],[43.0,50.0]]);
    afficherTest("test_multiplication_matrices_2x2", ok);
  } catch(e) { afficherTest("test_multiplication_matrices_2x2", false, e.message); }

  // test_multiplication_par_matrice_identite
  try {
    const { status, data } = await post("/matrices/multiply", { A: [[2,3],[4,5]], B: [[1,0],[0,1]] });
    const ok = status === 200 && deepEqual(data.resultat, [[2.0,3.0],[4.0,5.0]]);
    afficherTest("test_multiplication_par_matrice_identite", ok);
  } catch(e) { afficherTest("test_multiplication_par_matrice_identite", false, e.message); }

  // test_multiplication_matrices_non_carrees_compatibles
  try {
    const { status, data } = await post("/matrices/multiply", {
      A: [[1,2,3],[4,5,6]],
      B: [[7,8],[9,10],[11,12]]
    });
    const ok = status === 200 && deepEqual(data.resultat, [[58.0,64.0],[139.0,154.0]]);
    afficherTest("test_multiplication_matrices_non_carrees_compatibles", ok);
  } catch(e) { afficherTest("test_multiplication_matrices_non_carrees_compatibles", false, e.message); }

  // test_multiplication_3x3
  try {
    const { status, data } = await post("/matrices/multiply", {
      A: [[1,0,0],[0,1,0],[0,0,1]],
      B: [[4,5,6],[7,8,9],[1,2,3]]
    });
    const ok = status === 200 && deepEqual(data.resultat, [[4.0,5.0,6.0],[7.0,8.0,9.0],[1.0,2.0,3.0]]);
    afficherTest("test_multiplication_3x3", ok);
  } catch(e) { afficherTest("test_multiplication_3x3", false, e.message); }

  // test_multiplication_dimensions_incompatibles_retourne_400
  try {
    const { status, data } = await post("/matrices/multiply", {
      A: [[1,2],[3,4]],
      B: [[1,2,3],[4,5,6],[7,8,9]]
    });
    const ok = status === 400 && "erreur" in data;
    afficherTest("test_multiplication_dimensions_incompatibles_retourne_400", ok);
  } catch(e) { afficherTest("test_multiplication_dimensions_incompatibles_retourne_400", false, e.message); }

  // test_multiplication_cle_manquante_retourne_400
  try {
    const { status } = await post("/matrices/multiply", { A: [[1,2],[3,4]] });
    afficherTest("test_multiplication_cle_manquante_retourne_400", status === 400);
  } catch(e) { afficherTest("test_multiplication_cle_manquante_retourne_400", false, e.message); }

  // test_multiplication_par_matrice_nulle
  try {
    const { status, data } = await post("/matrices/multiply", { A: [[1,2],[3,4]], B: [[0,0],[0,0]] });
    const ok = status === 200 && deepEqual(data.resultat, [[0.0,0.0],[0.0,0.0]]);
    afficherTest("test_multiplication_par_matrice_nulle", ok);
  } catch(e) { afficherTest("test_multiplication_par_matrice_nulle", false, e.message); }
}

// ─── Route 3 — POST /matrices/transpose ─────────────────────────

async function testTransposeMatrix() {
  afficherSection("TestTransposeMatrix — POST /matrices/transpose");

  // test_transposee_matrice_2x2
  try {
    const { status, data } = await post("/matrices/transpose", { A: [[1,2],[3,4]] });
    const ok = status === 200 && data.operation === "transposee" && deepEqual(data.resultat, [[1.0,3.0],[2.0,4.0]]);
    afficherTest("test_transposee_matrice_2x2", ok);
  } catch(e) { afficherTest("test_transposee_matrice_2x2", false, e.message); }

  // test_transposee_matrice_rectangulaire_2x3
  try {
    const { status, data } = await post("/matrices/transpose", { A: [[1,2,3],[4,5,6]] });
    const ok = status === 200 && deepEqual(data.resultat, [[1.0,4.0],[2.0,5.0],[3.0,6.0]]);
    afficherTest("test_transposee_matrice_rectangulaire_2x3", ok);
  } catch(e) { afficherTest("test_transposee_matrice_rectangulaire_2x3", false, e.message); }

  // test_transposee_matrice_1x3
  try {
    const { status, data } = await post("/matrices/transpose", { A: [[10,20,30]] });
    const ok = status === 200 && deepEqual(data.resultat, [[10.0],[20.0],[30.0]]);
    afficherTest("test_transposee_matrice_1x3", ok);
  } catch(e) { afficherTest("test_transposee_matrice_1x3", false, e.message); }

  // test_double_transposee_donne_matrice_originale
  try {
    const A = [[1,2,3],[4,5,6],[7,8,9]];
    const r1 = await post("/matrices/transpose", { A });
    const r2 = await post("/matrices/transpose", { A: r1.data.resultat });
    const expected = A.map(row => row.map(v => parseFloat(v)));
    const ok = deepEqual(r2.data.resultat, expected);
    afficherTest("test_double_transposee_donne_matrice_originale", ok);
  } catch(e) { afficherTest("test_double_transposee_donne_matrice_originale", false, e.message); }

  // test_transposee_matrice_identite_inchangee
  try {
    const { status, data } = await post("/matrices/transpose", { A: [[1,0],[0,1]] });
    const ok = status === 200 && deepEqual(data.resultat, [[1.0,0.0],[0.0,1.0]]);
    afficherTest("test_transposee_matrice_identite_inchangee", ok);
  } catch(e) { afficherTest("test_transposee_matrice_identite_inchangee", false, e.message); }

  // test_transposee_cle_manquante_retourne_400
  try {
    const { status } = await post("/matrices/transpose", { B: [[1,2]] });
    afficherTest("test_transposee_cle_manquante_retourne_400", status === 400);
  } catch(e) { afficherTest("test_transposee_cle_manquante_retourne_400", false, e.message); }
}

// ─── Route 4 — POST /matrices/determinant ───────────────────────

async function testDeterminantMatrix() {
  afficherSection("TestDeterminantMatrix — POST /matrices/determinant");

  // test_determinant_matrice_2x2
  try {
    const { status, data } = await post("/matrices/determinant", { A: [[1,2],[3,4]] });
    const ok = status === 200 && data.operation === "determinant" && assertAlmostEqual(data.resultat, -2.0);
    afficherTest("test_determinant_matrice_2x2", ok);
  } catch(e) { afficherTest("test_determinant_matrice_2x2", false, e.message); }

  // test_determinant_matrice_identite
  try {
    const { status, data } = await post("/matrices/determinant", { A: [[1,0,0],[0,1,0],[0,0,1]] });
    const ok = status === 200 && assertAlmostEqual(data.resultat, 1.0);
    afficherTest("test_determinant_matrice_identite", ok);
  } catch(e) { afficherTest("test_determinant_matrice_identite", false, e.message); }

  // test_determinant_matrice_nulle
  try {
    const { status, data } = await post("/matrices/determinant", { A: [[0,0],[0,0]] });
    const ok = status === 200 && assertAlmostEqual(data.resultat, 0.0);
    afficherTest("test_determinant_matrice_nulle", ok);
  } catch(e) { afficherTest("test_determinant_matrice_nulle", false, e.message); }

  // test_determinant_matrice_3x3
  try {
    const { status, data } = await post("/matrices/determinant", { A: [[1,2,3],[4,5,6],[7,8,9]] });
    const ok = status === 200 && assertAlmostEqual(data.resultat, 0.0);
    afficherTest("test_determinant_matrice_3x3", ok);
  } catch(e) { afficherTest("test_determinant_matrice_3x3", false, e.message); }

  // test_determinant_matrice_1x1
  try {
    const { status, data } = await post("/matrices/determinant", { A: [[5]] });
    const ok = status === 200 && assertAlmostEqual(data.resultat, 5.0);
    afficherTest("test_determinant_matrice_1x1", ok);
  } catch(e) { afficherTest("test_determinant_matrice_1x1", false, e.message); }

  // test_determinant_matrice_non_carree_retourne_400
  try {
    const { status, data } = await post("/matrices/determinant", { A: [[1,2,3],[4,5,6]] });
    const ok = status === 400 && "erreur" in data;
    afficherTest("test_determinant_matrice_non_carree_retourne_400", ok);
  } catch(e) { afficherTest("test_determinant_matrice_non_carree_retourne_400", false, e.message); }

  // test_determinant_cle_manquante_retourne_400
  try {
    const { status } = await post("/matrices/determinant", {});
    afficherTest("test_determinant_cle_manquante_retourne_400", status === 400);
  } catch(e) { afficherTest("test_determinant_cle_manquante_retourne_400", false, e.message); }
}

// ─── Route 5 — POST /matrices/inverse ───────────────────────────

async function testInverseMatrix() {
  afficherSection("TestInverseMatrix — POST /matrices/inverse");

  // test_inverse_matrice_2x2_simple
  try {
    const { status, data } = await post("/matrices/inverse", { A: [[1,2],[3,4]] });
    const inv = data.resultat;
    const A = [[1,2],[3,4]]; const n = 2;
    const produit = Array.from({length: n}, (_, i) =>
      Array.from({length: n}, (_, j) =>
        A[i].reduce((s, _, k) => s + A[i][k] * inv[k][j], 0)
      )
    );
    const ok = status === 200 && data.operation === "inverse"
      && assertAlmostEqual(produit[0][0], 1.0) && assertAlmostEqual(produit[0][1], 0.0)
      && assertAlmostEqual(produit[1][0], 0.0) && assertAlmostEqual(produit[1][1], 1.0);
    afficherTest("test_inverse_matrice_2x2_simple", ok);
  } catch(e) { afficherTest("test_inverse_matrice_2x2_simple", false, e.message); }

  // test_inverse_matrice_identite
  try {
    const { status, data } = await post("/matrices/inverse", { A: [[1,0],[0,1]] });
    const inv = data.resultat;
    const ok = status === 200
      && assertAlmostEqual(inv[0][0], 1.0) && assertAlmostEqual(inv[0][1], 0.0)
      && assertAlmostEqual(inv[1][0], 0.0) && assertAlmostEqual(inv[1][1], 1.0);
    afficherTest("test_inverse_matrice_identite", ok);
  } catch(e) { afficherTest("test_inverse_matrice_identite", false, e.message); }

  // test_inverse_matrice_diagonale
  try {
    const { status, data } = await post("/matrices/inverse", { A: [[2,0],[0,4]] });
    const inv = data.resultat;
    const ok = status === 200 && assertAlmostEqual(inv[0][0], 0.5) && assertAlmostEqual(inv[1][1], 0.25);
    afficherTest("test_inverse_matrice_diagonale", ok);
  } catch(e) { afficherTest("test_inverse_matrice_diagonale", false, e.message); }

  // test_inverse_matrice_3x3
  try {
    const { status, data } = await post("/matrices/inverse", { A: [[2,1,0],[0,3,1],[0,0,4]] });
    const ok = status === 200 && "resultat" in data && data.resultat.length === 3;
    afficherTest("test_inverse_matrice_3x3", ok);
  } catch(e) { afficherTest("test_inverse_matrice_3x3", false, e.message); }

  // test_inverse_matrice_singuliere_retourne_400
  try {
    const { status, data } = await post("/matrices/inverse", { A: [[1,2],[2,4]] });
    const msg = (data.erreur || "").toLowerCase();
    const ok = status === 400 && "erreur" in data && (msg.includes("singuliere") || msg.includes("inversible"));
    afficherTest("test_inverse_matrice_singuliere_retourne_400", ok);
  } catch(e) { afficherTest("test_inverse_matrice_singuliere_retourne_400", false, e.message); }

  // test_inverse_matrice_non_carree_retourne_400
  try {
    const { status, data } = await post("/matrices/inverse", { A: [[1,2,3],[4,5,6]] });
    const ok = status === 400 && "erreur" in data;
    afficherTest("test_inverse_matrice_non_carree_retourne_400", ok);
  } catch(e) { afficherTest("test_inverse_matrice_non_carree_retourne_400", false, e.message); }

  // test_inverse_cle_manquante_retourne_400
  try {
    const { status } = await post("/matrices/inverse", { B: [[1]] });
    afficherTest("test_inverse_cle_manquante_retourne_400", status === 400);
  } catch(e) { afficherTest("test_inverse_cle_manquante_retourne_400", false, e.message); }

  // test_inverse_matrice_zero_retourne_400
  try {
    const { status } = await post("/matrices/inverse", { A: [[0,0],[0,0]] });
    afficherTest("test_inverse_matrice_zero_retourne_400", status === 400);
  } catch(e) { afficherTest("test_inverse_matrice_zero_retourne_400", false, e.message); }
}

// ─── Tests de robustesse ────────────────────────────────────────

async function testRobustesse() {
  afficherSection("TestRobustesse — Toutes les routes");

  // test_body_vide_add_retourne_400
  try {
    const { status } = await post("/matrices/add", {});
    afficherTest("test_body_vide_add_retourne_400", status === 400);
  } catch(e) { afficherTest("test_body_vide_add_retourne_400", false, e.message); }

  // test_body_vide_multiply_retourne_400
  try {
    const { status } = await post("/matrices/multiply", {});
    afficherTest("test_body_vide_multiply_retourne_400", status === 400);
  } catch(e) { afficherTest("test_body_vide_multiply_retourne_400", false, e.message); }

  // test_body_vide_determinant_retourne_400
  try {
    const { status } = await post("/matrices/determinant", {});
    afficherTest("test_body_vide_determinant_retourne_400", status === 400);
  } catch(e) { afficherTest("test_body_vide_determinant_retourne_400", false, e.message); }

  // test_body_vide_inverse_retourne_400
  try {
    const { status } = await post("/matrices/inverse", {});
    afficherTest("test_body_vide_inverse_retourne_400", status === 400);
  } catch(e) { afficherTest("test_body_vide_inverse_retourne_400", false, e.message); }

  // test_matrice_vide_retourne_400

    const { status } = await post("/matrices/add", { A: [], B: [] });
    afficherTest("test_matrice_vide_retourne_400", [200, 400, 500].includes(status));

  // test_addition_retourne_cle_operation
  try {

  // test_multiplication_retourne_cle_resultat

    const { status, data } = await post("/matrices/multiply", { A: [[1]], B: [[2]] });

  } catch(e) { afficherTest("test_multiplication_retourne_cle_resultat", false, e.message); }

  // test_erreur_retourne_cle_erreur
  try {
    const { status, data } = await post("/matrices/add", { A: [[1,2]], B: [[1]] });
    afficherTest("test_erreur_retourne_cle_erreur", status === 400 && "erreur" in data);
  } catch(e) { afficherTest("test_erreur_retourne_cle_erreur", false, e.message); }
}

// ─── Lancement de tous les tests ────────────────────────────────

async function lancerTousLesTests() {
  passed = 0; failed = 0;
  document.getElementById("results").innerHTML = "";
  document.getElementById("summary").innerHTML = "";

  await testAddMatrices();
  await testMultiplyMatrices();
  await testTransposeMatrix();
  await testDeterminantMatrix();
  await testInverseMatrix();
  await testRobustesse();

  const total = passed + failed;
  const summary = document.getElementById("summary");
  summary.className = failed === 0 ? "summary-pass" : "summary-fail";
  summary.textContent = `Résultat : ${passed}/${total} tests réussis` + (failed > 0 ? ` — ${failed} échec(s)` : " ✓ Tous les tests passent");
}
</script>
